set-option -g default-shell /bin/zsh
set-option -g mouse on
set-option -g set-clipboard on
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@:Ss@:Se@'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Pane navigation (was Mac Optionnd -n M-h if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys M-h" "select-pane -L"
bind -n M-j if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys M-j" "select-pane -D"
bind -n M-k if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys M-k" "select-pane -U"
bind -n M-l if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys M-l" "select-pane -R"
bind -n M-h if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys M-h" "select-pane -L"

# Split panes (was Option+; and Option+')
bind -n M-\; split-window -c "#{pane_current_path}"
bind -n M-\' split-window -h -c "#{pane_current_path}"

# Window switching (was Option+1-0)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# Reorder windows (was Option+z)
bind -n M-z movew -r

# Pane resize (unchanged, these work fine on Windows)
bind -n C-j resize-pane -D 3
bind -n C-k resize-pane -U 3
bind -n C-h resize-pane -L 3
bind -n C-l resize-pane -R 3

set -g status on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 100000

bind-key -T root -n Pageup copy-mode -u

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour0 bg=colour220'

# panes
set -g pane-border-style 'fg=colour0 bg=colour237'
set -g pane-active-border-style 'bg=colour237 fg=colour255'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour245 fg=colour0'
set -g status-left ''
set -g status-right '#[fg=colour0,bg=colour245] %d/%m #[fg=colour0,bg=colour245] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
set -g window-style 'fg=colour245 bg=colour234'
set -g window-active-style 'fg=colour255 bg=colour232'

setw -g window-status-current-style 'fg=colour255 bg=colour0 bold'
setw -g window-status-current-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '
setw -g window-status-style 'fg=colour250 bg=colour240'
setw -g window-status-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour255 bg=colour240 bold'

# don't destroy sessions
set-option -g detach-on-destroy off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'

