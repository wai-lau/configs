set-option -g default-shell /bin/zsh
set-option -g mouse on
set-option -g set-clipboard on
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@:Ss@:Se@'
# Advertise OSC52 clipboard support — ST terminator (\E\\), not BEL (\7).
# Windows Terminal silently drops BEL-terminated OSC52; ST works.
set-option -ga terminal-overrides ',*:Ms=\E]52;c;%p2%s\E\\\\'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on

# CSI u extended keys (Shift+Enter etc) — accept from outer terminal, forward to inner apps.
# Windows Terminal sends \e[13;2u for Shift+Enter; without these tmux strips it to plain Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'screen*:extkeys:clipboard'

# Pane navigation - forward to vim if active, else switch tmux pane
bind -n M-h if-shell -F '#{==:#{pane_current_command},vim}' "send-keys M-h" "select-pane -L"
bind -n M-j if-shell -F '#{==:#{pane_current_command},vim}' "send-keys M-j" "select-pane -D"
bind -n M-k if-shell -F '#{==:#{pane_current_command},vim}' "send-keys M-k" "select-pane -U"
bind -n M-l if-shell -F '#{==:#{pane_current_command},vim}' "send-keys M-l" "select-pane -R"

# Split panes (was Option+; and Option+')
bind -n M-\; split-window -c "#{pane_current_path}"
bind -n M-\' split-window -h -c "#{pane_current_path}"

# Window switching (was Option+1-0)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# Reorder windows (was Option+z)
bind -n M-z movew -r

# Pane resize (unchanged, these work fine on Windows)
bind -n C-j resize-pane -D 3
bind -n C-k resize-pane -U 3
bind -n C-h resize-pane -L 3
bind -n C-l resize-pane -R 3

set -g status on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 100000

bind-key -T root -n Pageup copy-mode -u

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour0 bg=colour220'

# panes
set -g pane-border-style 'fg=colour0 bg=colour237'
set -g pane-active-border-style 'bg=colour237 fg=colour255'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour245 fg=colour0'
set -g status-left ''
set -g status-right '#{?#{||:#{==:#(whoami),wai},#{==:#(whoami),root}},#[fg=colour0#,bg=colour255],#[fg=colour208#,bg=colour0]} #(whoami) #[fg=colour0,bg=colour245] %d/%m #[fg=colour0,bg=colour245] %H:%M:%S '
set -g status-right-length 60
set -g status-left-length 20
set -g window-style 'fg=colour245 bg=default'
set -g window-active-style 'fg=colour255 bg=default'

setw -g window-status-current-style 'fg=colour255 bg=colour0 bold'
setw -g window-status-current-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '
setw -g window-status-style 'fg=colour250 bg=colour240'
setw -g window-status-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour255 bg=colour240 bold'

# don't destroy sessions
set-option -g detach-on-destroy off

# Default mouse bindings (re-declared so .tmux-off.conf's `unbind -a -T root`
# can be undone by re-sourcing .tmux.conf — tmux only loads defaults at startup).
bind -T root MouseDown1Pane    select-pane -t = \; send-keys -M
bind -T root MouseDown2Pane    select-pane -t = \; send-keys -M
bind -T root MouseDown3Pane    select-pane -t = \; send-keys -M
bind -T root MouseDrag1Pane    if -Ft= '#{mouse_any_flag}' 'if -Ft= "#{pane_in_mode}" "copy-mode -M" "send-keys -M"' 'copy-mode -M'
bind -T root MouseDragEnd1Pane select-pane -t =
bind -T root WheelUpPane       if -Ft= '#{mouse_any_flag}' 'send-keys -M' 'if -Ft= "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind -T root WheelDownPane     if -Ft= '#{mouse_any_flag}' 'send-keys -M' 'send-keys -M'

# Mouse drag copy → OSC52 written directly to client tty (bypasses tmux
# set-clipboard relay, which is unreliable across nested tmux/WSL/ConPTY).
#   Local (outer tmux): plain OSC52, ConPTY forwards to WT.
#   Remote (over SSH):  wrap in tmux passthrough so local tmux strips wrapper
#                       and emits plain OSC52 to its own client tty.
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe '~/bin/tmux-osc52' \; send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe '~/bin/tmux-osc52' \; send-keys -X cancel

# Nested tmux toggle: M-q disables outer bindings so inner tmux gets keys.
# Only bind on outer (non-SSH) host — inner tmux must NOT grab M-q.
if-shell '[ -z "$SSH_CONNECTION" ]' \
    'bind -T root M-q source-file ~/.tmux-off.conf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'

