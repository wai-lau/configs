set-option -g default-shell /bin/zsh
set-option -g mouse on
set-option -g set-clipboard on
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@:Ss@:Se@'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind-key -n ˙ if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n ∆ if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n ˚ if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n ¬ if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind -n … split-window -c "#{pane_current_path}"
bind -n æ split-window -h -c "#{pane_current_path}"
bind -n ¡ select-window -t :1
bind -n ™ select-window -t :2
bind -n £ select-window -t :3
bind -n ¢ select-window -t :4
bind -n ∞ select-window -t :5
bind -n § select-window -t :6
bind -n ¶ select-window -t :7
bind -n • select-window -t :8
bind -n ª select-window -t :9
bind -n º select-window -t :10

bind -n Ω movew -r

bind -n C-j resize-pane -D 3
bind -n C-k resize-pane -U 3
bind -n C-h resize-pane -L 3
bind -n C-l resize-pane -R 3

set -g status on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 100000

set -g terminal-overrides 'xterm*:smcup@:rmcup@'

bind-key -T root -n Pageup copy-mode -u

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour0 bg=colour220'

# panes
set -g pane-border-style 'fg=colour0 bg=colour237'
set -g pane-active-border-style 'bg=colour237 fg=colour255'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour245 fg=colour0'
set -g status-left ''
set -g status-right '#[fg=colour0,bg=colour245] %d/%m #[fg=colour0,bg=colour245] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour255 bg=colour0 bold'
setw -g window-status-current-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '

setw -g window-status-style 'fg=colour250 bg=colour240'
setw -g window-status-format ' #I#[fg=colour255] | #[fg=colour255]#W#[fg=colour255]#F '

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour255 bg=colour240 bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
