# Nested-over-SSH (inner tmux): wrap OSC52 in tmux passthrough so the OUTER
# tmux strips one layer and emits clean OSC52 to its own client (Windows
# Terminal). Sourced only when $SSH_CONNECTION is set (gate in ~/.tmux.conf).
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe '~/bin/tmux-osc52 --wrap' \; send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe '~/bin/tmux-osc52 --wrap' \; send-keys -X cancel
