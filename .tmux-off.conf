# Nested-tmux passthrough mode. Sourced by M-q from .tmux.conf.
# Disables outer root bindings + mouse so inner tmux gets every key.
# M-q again restores normal mode by re-sourcing .tmux.conf.

# Wipe ONLY the root table. Leave copy-mode bindings intact — unbinding
# them would lose mouse-highlight-to-clipboard after restore (source-file
# doesn't reset to defaults, just re-runs config). Leave the prefix table
# alone too: `prefix None` below already makes it unreachable, and wiping
# it destroys the 85 default bindings, which a re-source can't bring back.
unbind -a -T root

# Escape hatch — bind in BOTH root and off tables since `set -g key-table off`
# may redirect lookups depending on tmux version/state.
bind -T root M-q   source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"
bind -T root M-F12 source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"
bind -T root F12   source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"
bind -T off  M-q   source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"
bind -T off  M-F12 source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"
bind -T off  F12   source-file ~/.tmux.conf \; refresh-client -S \; display-message "tmux: outer ON"

set -g prefix None
# DON'T set key-table off — redirects active table away from root, may break
# key dispatch in tmux 3.4. Active table stays "root" so escape bindings fire.
set -g mouse off

# Visual indicator: dimmed status bar
set -g status-style 'bg=colour238 fg=colour245'
set -g window-status-current-style 'fg=colour245 bg=colour238'
set -g window-status-style 'fg=colour245 bg=colour238'

# Cancel any active copy-mode so scroll forwards to inner
if -F '#{pane_in_mode}' 'send-keys -X cancel'

refresh-client -S
display-message "tmux: outer OFF (M-q / M-F12 / F12 to restore)"
